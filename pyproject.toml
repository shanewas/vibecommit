[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vibecommit"
version = "1.0.0"
description = "🪄 VibeCommit - Beautiful, smart & fun conventional commits with vibes (CLI)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Shanewas Ahmed", email = "shanewasahmed@gmail.com"}
]
keywords = [
  "git", "commit", "cli", "vibe", "emoji", "conventional-commits",
  "productivity", "developer-tools", "git-hooks"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Version Control :: Git",
  "Topic :: Utilities",
  "Typing :: Typed",
]
dependencies = [
  "typer[all]>=0.15.1",
  "rich>=13.9.4",
  "pyperclip>=1.9.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "mypy>=1.10",
]
test = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
]

[project.scripts]
vibecommit = "vibecommit.cli:app"
vc = "vibecommit.cli:app"

[project.urls]
Homepage = "https://github.com/shanewas/vibecommit"
Repository = "https://github.com/shanewas/vibecommit"
Issues = "https://github.com/shanewas/vibecommit/issues"
Changelog = "https://github.com/shanewas/vibecommit/blob/main/CHANGELOG.md"
Documentation = "https://github.com/shanewas/vibecommit#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/vibecommit"]

[tool.hatch.build.targets.sdist]
include = [
  "src/",
  "tests/",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "CONTRIBUTING.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short --strict-markers"
markers = [
  "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [".git", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # typer style

[tool.ruff.lint.isort]
known-first-party = ["vibecommit"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true
files = ["src/vibecommit"]

[tool.coverage.run]
source = ["src/vibecommit"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]