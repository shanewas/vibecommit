# Ruff configuration for VibeCommit
line-length = 88
target-version = "py310"

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008"]  # typer.Argument style triggers B008

[lint.isort]
known-first-party = ["vibecommit"]

[format]
quote-style = "double"
indent-style = "space"